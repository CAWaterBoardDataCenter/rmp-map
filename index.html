<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Regional Monitoring Station Footprints</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ribbon-height: 56px;
      --bg: #fdfdfc;
      --ribbon-bg: #fbfbfa;
      --ribbon-border: #e5e3df;
      --text: #1c1917;
      --text-soft: #6b6862;
      --text-softer: #928f89;
      --accent: #0f766e;
      --accent-dark: #0b5952;
      --accent-soft: #ccfbf1;
      --accent-bg: #f0fdfa;
      --surface: #ffffff;
      --surface-hover: #f5f5f4;
      --border: #e7e5e4;
      --gray-fill: #cbd5e1;
      --gray-stroke: #94a3b8;
      --shadow-sm: 0 1px 2px rgba(28, 25, 23, 0.06);
      --shadow-md: 0 8px 24px rgba(28, 25, 23, 0.12);
      --shadow-lg: 0 24px 64px rgba(28, 25, 23, 0.22);
    }

    html, body {
      height: 100%;
      font-family: "DM Sans", "Source Sans 3", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    * {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    *::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .ribbon {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2000;
      background: var(--ribbon-bg);
      color: var(--text);
      border-bottom: 1px solid var(--ribbon-border);
      box-shadow: 0 1px 4px rgba(28, 25, 23, 0.05);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      min-height: var(--ribbon-height, 56px);
    }

    .ribbon-logo {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: var(--accent);
      display: inline-block;
      flex-shrink: 0;
    }

    .ribbon-title {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 650;
      letter-spacing: -0.01em;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      padding: 4px 6px;
      margin: -4px -6px;
      transition: background 0.12s ease;
    }

    .ribbon-title:hover {
      background: var(--surface-hover);
    }

    .ribbon-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .ribbon-sep {
      width: 1px;
      height: 22px;
      background: var(--border);
      margin: 0 2px;
      flex-shrink: 0;
    }

    .ribbon-dropdown {
      position: relative;
    }

    .ribbon-dropdown-trigger,
    .ribbon-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 550;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      line-height: 1.2;
      box-shadow: none;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    }

    .ribbon-dropdown-trigger:hover,
    .ribbon-btn:hover {
      background: var(--surface-hover);
      border-color: var(--text-softer);
    }

    .ribbon-dropdown.open .ribbon-dropdown-trigger {
      background: var(--surface-hover);
      border-color: var(--text-softer);
      color: var(--text);
    }

    .ribbon-btn-accent,
    .ribbon-key {
      color: var(--accent-dark);
      background: var(--accent-bg);
      border-color: #99f6e4;
    }

    .ribbon-btn-accent:hover,
    .ribbon-key:hover {
      background: var(--accent-soft);
      border-color: #5eead4;
      color: var(--accent-dark);
    }

    .ribbon-dropdown.open .ribbon-key {
      background: var(--accent-soft);
      border-color: #5eead4;
    }

    .ribbon-dropdown-chevron {
      width: 5px;
      height: 5px;
      border-right: 1px solid var(--text-softer);
      border-bottom: 1px solid var(--text-softer);
      transform: rotate(45deg) translateY(-1px);
      display: inline-block;
      flex-shrink: 0;
      transition: transform 0.15s ease;
      font-size: 0;
      line-height: 0;
      color: transparent;
      margin-left: 1px;
    }

    .ribbon-dropdown.open .ribbon-dropdown-chevron {
      transform: rotate(225deg) translateY(-1px);
    }

    .ribbon-dropdown-panel {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 210px;
      max-width: min(320px, 90vw);
      max-height: min(380px, 60vh);
      overflow-y: auto;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      z-index: 2100;
    }

    .ribbon-dropdown.open .ribbon-dropdown-panel {
      display: block;
    }

    .dropdown-check,
    .program-check,
    .overlay-check {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.72rem;
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 5px;
      user-select: none;
      color: var(--text);
    }

    .dropdown-check:hover,
    .program-check:hover,
    .overlay-check:hover {
      background: var(--surface-hover);
    }

    .dropdown-check input,
    .program-check input,
    .overlay-check input {
      accent-color: currentColor;
      flex-shrink: 0;
    }

    .program-check .program-check-main {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .program-check .program-check-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .info-btn {
      flex-shrink: 0;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-softer);
      font-size: 0.66rem;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .info-btn:hover {
      background: var(--accent-bg);
      color: var(--accent-dark);
      border-color: var(--accent);
    }

    .program-check.disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .dropdown-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    .dropdown-option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 7px 10px;
      font-family: inherit;
      font-size: 0.8rem;
      color: var(--text);
      background: none;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .dropdown-option:hover {
      background: var(--surface-hover);
    }

    .dropdown-option.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    #program-list,
    #board-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .filter-empty-note {
      padding: 8px 10px;
      font-size: 0.78rem;
      color: var(--text-soft);
    }

    .ribbon-status {
      margin-left: auto;
      font-size: 0.65rem;
      color: var(--text-softer);
      max-width: 280px;
      text-align: right;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #map {
      position: fixed;
      top: var(--ribbon-height, 56px);
      left: 0;
      right: 0;
      bottom: 0;
      background: #eef2f1;
      transition: right 0.22s ease;
    }

    body.summary-open #map {
      right: 50%;
    }

    .detail-panel,
    .summary-drawer {
      position: fixed;
      top: var(--ribbon-height, 56px);
      right: 0;
      width: min(420px, 50vw);
      height: calc(100% - var(--ribbon-height, 56px));
      background: var(--surface);
      box-shadow: -4px 0 24px rgba(28, 25, 23, 0.16);
      z-index: 1500;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.22s ease, right 0.22s ease, width 0.22s ease;
    }

    /* Detail hex panel stays a narrower overlay within the left map half when summary is open */
    body.summary-open .detail-panel {
      right: 50%;
    }

    .summary-drawer {
      width: 50%;
      min-width: 320px;
      z-index: 1600;
    }

    .detail-panel.open,
    .summary-drawer.open { transform: translateX(0); }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-hover);
    }

    .detail-header h2 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }

    .detail-header .meta {
      font-size: 0.78rem;
      color: var(--text-soft);
      margin-top: 4px;
    }

    .detail-close {
      background: none;
      border: none;
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
      color: var(--text-soft);
      padding: 0 4px;
    }

    .summary-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-hover);
    }

    .summary-header-title {
      flex: 1;
      min-width: 0;
      text-align: center;
    }

    .summary-header-title h2 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .summary-header-title .meta {
      font-size: 0.72rem;
      color: var(--text-soft);
      margin-top: 2px;
    }

    .summary-nav-btn {
      flex-shrink: 0;
      padding: 6px 11px;
      font-size: 0.95rem;
    }

    .summary-website-link {
      display: inline-block;
      margin-bottom: 12px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent-dark);
      text-decoration: none;
      border: 1px solid #99f6e4;
      background: var(--accent-bg);
      padding: 6px 12px;
      border-radius: 7px;
    }

    .summary-website-link:hover {
      background: var(--accent-soft);
      border-color: #5eead4;
    }

    .detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
    }

    .station-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }

    .station-table th {
      text-align: left;
      padding: 6px 8px;
      background: var(--surface-hover);
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 0;
    }

    .station-table td {
      padding: 6px 8px;
      border-bottom: 1px solid #f1f5f4;
      vertical-align: top;
    }

    .station-table tr:hover td { background: var(--surface-hover); }

    .legend-panel {
      line-height: 1.45;
      background: var(--surface);
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      min-width: 148px;
      max-width: 190px;
      overflow: hidden;
    }

    .legend-panel-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-soft);
      padding: 8px 10px 4px;
    }

    .legend-block {
      border-top: 1px solid #f1f5f4;
    }

    .legend-block:first-of-type {
      border-top: none;
    }

    .legend-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: 7px 10px;
      border: none;
      background: none;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      color: var(--text);
    }

    .legend-toggle:hover {
      background: var(--surface-hover);
    }

    .legend-chevron {
      font-size: 0.6rem;
      color: var(--text-softer);
      transition: transform 0.15s ease;
      flex-shrink: 0;
    }

    .legend-toggle.expanded .legend-chevron {
      transform: rotate(90deg);
    }

    .legend-body {
      display: none;
      padding: 0 10px 8px 22px;
    }

    .legend-body.open {
      display: block;
    }

    .legend-row {
      font-size: 0.72rem;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .legend-swatch {
      width: 16px;
      height: 12px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      flex-shrink: 0;
    }

    .legend-swatch-hatch {
      background: repeating-linear-gradient(
        45deg,
        #0891b2 0 3px,
        #9333ea 3px 6px,
        #dc2626 6px 9px
      );
    }

    .legend-swatch-gray {
      background: var(--gray-fill);
    }

    .county-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text);
      text-shadow: 1px 1px 2px #fff, -1px -1px 2px #fff, 0 0 4px #fff;
      white-space: nowrap;
      pointer-events: none;
      text-align: center;
    }

    .board-label {
      font-size: 11px;
      font-weight: 700;
      color: #57534e;
      text-shadow: 1px 1px 2px #fff, -1px -1px 2px #fff, 0 0 4px #fff;
      white-space: nowrap;
      pointer-events: none;
      text-align: center;
    }

    /* Welcome modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(28, 25, 23, 0.45);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .modal-overlay.open { display: flex; }

    .modal-card {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      width: min(640px, 94vw);
      height: min(480px, 84vh);
      max-height: min(480px, 84vh);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 20px 0;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-tab {
      padding: 9px 12px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-soft);
      background: none;
      border: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .modal-tab.active {
      color: var(--accent-dark);
      border-bottom-color: var(--accent);
    }

    .modal-tab:hover { color: var(--text); }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
      color: var(--text-soft);
      padding: 4px 6px;
      margin-left: auto;
      margin-bottom: 6px;
    }

    .modal-close:hover { color: var(--text); }

    .modal-body {
      padding: 16px 22px;
      overflow-y: auto;
      flex: 1 1 auto;
      min-height: 0;
      font-size: 0.92rem;
      line-height: 1.55;
      color: var(--text);
    }

    .modal-body p { margin-bottom: 0.85em; }
    .modal-body p:last-child { margin-bottom: 0; }
    .modal-body a { color: var(--accent-dark); }

    .modal-footer {
      padding: 10px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 11px 24px;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .btn-primary:hover { background: var(--accent-dark); }

    .profile-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .profile-card:hover {
      box-shadow: var(--shadow-sm);
      border-color: var(--accent);
    }

    .profile-card h4 {
      font-size: 0.86rem;
      font-weight: 700;
      margin-bottom: 3px;
      color: var(--accent-dark);
    }

    .profile-card p {
      font-size: 0.78rem;
      color: var(--text-soft);
      margin: 0;
    }

    .code-block {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 10px;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.72rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text);
    }

    .visually-hidden {
      position: absolute !important;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .summary-url {
      display: block;
      font-size: 0.92rem;
      line-height: 1.45;
      color: var(--accent-dark);
      word-break: break-all;
      margin-bottom: 16px;
    }

    #summary-program-detail {
      font-size: 1.02rem;
      line-height: 1.7;
    }

    #summary-program-detail p {
      margin-bottom: 0;
    }

    .summary-header-title h2 {
      font-size: 1.15rem;
    }

    .summary-header-title .meta {
      display: none;
    }

    .welcome-program-nav.summary-nav {
      margin: 0 0 10px;
      padding-top: 0;
      border-top: none;
      justify-content: space-between;
    }

    @media (max-width: 720px) {
      .ribbon-status { display: none; }
      .ribbon-title { font-size: 0.82rem; }
    }
  </style>
</head>
<body>
  <header class="ribbon">
    <div class="ribbon-controls">
      <button type="button" class="ribbon-btn ribbon-key" id="about-btn">About</button>
      <button type="button" class="ribbon-btn ribbon-btn-accent" id="summary-btn">Summary</button>

      <span class="ribbon-sep"></span>

      <div class="ribbon-dropdown" id="programs-dropdown">
        <button type="button" class="ribbon-dropdown-trigger ribbon-key" id="programs-trigger" aria-haspopup="true" aria-expanded="false">
          Programs <span class="ribbon-dropdown-chevron"></span>
        </button>
        <div class="ribbon-dropdown-panel" id="programs-panel">
          <label class="dropdown-check">
            <input type="checkbox" id="select-all" /> All Programs
          </label>
          <div class="dropdown-divider"></div>
          <div id="program-list"></div>
        </div>
      </div>

      <div class="ribbon-dropdown" id="hex-dropdown">
        <button type="button" class="ribbon-dropdown-trigger" id="hex-trigger" aria-haspopup="true" aria-expanded="false">
          Hex · 5 km <span class="ribbon-dropdown-chevron"></span>
        </button>
        <div class="ribbon-dropdown-panel">
          <button type="button" class="dropdown-option" data-mode="auto">Auto (zoom-linked)</button>
          <button type="button" class="dropdown-option" data-res="8">1 km</button>
          <button type="button" class="dropdown-option" data-res="7">3 km</button>
          <button type="button" class="dropdown-option active" data-res="6">5 km</button>
        </div>
      </div>

      <div class="ribbon-dropdown" id="basemap-dropdown">
        <button type="button" class="ribbon-dropdown-trigger" id="basemap-trigger" aria-haspopup="true" aria-expanded="false">
          Map · Light Grey <span class="ribbon-dropdown-chevron"></span>
        </button>
        <div class="ribbon-dropdown-panel">
          <button type="button" class="dropdown-option active" data-basemap="light">Light Grey</button>
          <button type="button" class="dropdown-option" data-basemap="terrain">Terrain</button>
          <div class="dropdown-divider"></div>
          <label class="dropdown-check">
            <input type="checkbox" id="map-labels-toggle" checked /> Labels
          </label>
        </div>
      </div>

      <div class="ribbon-dropdown" id="overlays-dropdown">
        <button type="button" class="ribbon-dropdown-trigger" id="overlays-trigger" aria-haspopup="true" aria-expanded="false">
          Overlays · Off <span class="ribbon-dropdown-chevron"></span>
        </button>
        <div class="ribbon-dropdown-panel">
          <label class="overlay-check">
            <input type="checkbox" id="county-overlay" /> California Counties
          </label>
          <label class="overlay-check">
            <input type="checkbox" id="regional-board-overlay" /> Regional Water Boards
          </label>
        </div>
      </div>

      <div class="ribbon-dropdown" id="filter-dropdown">
        <button type="button" class="ribbon-dropdown-trigger" id="filter-trigger" aria-haspopup="true" aria-expanded="false">
          Filter · All <span class="ribbon-dropdown-chevron"></span>
        </button>
        <div class="ribbon-dropdown-panel" id="filter-panel">
          <label class="dropdown-check">
            <input type="checkbox" id="filter-select-all" checked /> All Regional Boards
          </label>
          <div class="dropdown-divider"></div>
          <div id="board-list">
            <div class="filter-empty-note">Loading regional boards…</div>
          </div>
        </div>
      </div>
    </div>

    // ---- Regional board filter: simple ray-casting point-in-polygon (no turf dependency) ----

    function pointInRing(point, ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0], yi = ring[i][1];
        const xj = ring[j][0], yj = ring[j][1];
        const intersect =
          yi > point[1] !== yj > point[1] &&
          point[0] < ((xj - xi) * (point[1] - yi)) / (yj - yi) + xi;
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function pointInPolygonRings(point, rings) {
      if (!rings.length || !pointInRing(point, rings[0])) return false;
      for (let i = 1; i < rings.length; i++) {
        if (pointInRing(point, rings[i])) return false; // inside a hole
      }
      return true;
    }

    function pointInPolygonGeom(point, geometry) {
      if (!geometry) return false;
      if (geometry.type === "Polygon") {
        return pointInPolygonRings(point, geometry.coordinates);
      }
      if (geometry.type === "MultiPolygon") {
        return geometry.coordinates.some((rings) => pointInPolygonRings(point, rings));
      }
      return false;
    }

    function polygonCentroid(geometry) {
      let ring;
      if (geometry?.type === "Polygon") ring = geometry.coordinates[0];
      else if (geometry?.type === "MultiPolygon") ring = geometry.coordinates[0]?.[0];
      if (!ring || !ring.length) return null;
      let x = 0, y = 0;
      ring.forEach((p) => { x += p[0]; y += p[1]; });
      return [x / ring.length, y / ring.length];
    }

    function indexBoardGeometries(geojson) {
      boardGeometryByName = new Map();
      allBoardNames = [];
      (geojson.features || []).forEach((f) => {
        const name = f.properties?.name;
        if (!name) return;
        boardGeometryByName.set(name, f.geometry);
        allBoardNames.push(name);
      });
      allBoardNames.sort((a, b) => a.localeCompare(b));
    }

    function isBoardFilterActive() {
      return allBoardNames.length > 0 && selectedBoardNames.size < allBoardNames.length;
    }

    function pointMatchesSelectedBoards(lon, lat) {
      for (const name of selectedBoardNames) {
        const geom = boardGeometryByName.get(name);
        if (geom && pointInPolygonGeom([lon, lat], geom)) return true;
      }
      return false;
    }

    function featureMatchesBoardFilter(feature) {
      if (!isBoardFilterActive()) return true;
      const props = feature.properties || {};
      const stations = props.stations || [];
      if (stations.length) {
        return stations.some(
          (s) => Number.isFinite(s.lat) && Number.isFinite(s.lon) && pointMatchesSelectedBoards(s.lon, s.lat)
        );
      }
      // Area/wetland hexes without stations — fall back to hex polygon centroid.
      const centroid = polygonCentroid(feature.geometry);
      if (!centroid) return true;
      return pointMatchesSelectedBoards(centroid[0], centroid[1]);
    }

    function buildBoardFilterControls() {
      const list = document.getElementById("board-list");
      list.innerHTML = "";

      if (!allBoardNames.length) {
        list.innerHTML = '<div class="filter-empty-note">Regional board data unavailable.</div>';
        return;
      }

      allBoardNames.forEach((name) => {
        const label = document.createElement("label");
        label.className = "dropdown-check";
        label.innerHTML = `<input type="checkbox" name="board" value="${escapeHtml(name)}" checked /> ${escapeHtml(name)}`;
        label.querySelector("input").addEventListener("change", () => {
          syncBoardSelectAll();
          updateFilterTriggerLabel();
          renderMap();
        });
        list.appendChild(label);
      });

      selectedBoardNames = new Set(allBoardNames);
      syncBoardSelectAll();
      updateFilterTriggerLabel();
    }

    function syncBoardSelectAll() {
      const boxes = [...document.querySelectorAll('input[name="board"]')];
      selectedBoardNames = new Set(boxes.filter((b) => b.checked).map((b) => b.value));
      const selectAll = document.getElementById("filter-select-all");
      if (!boxes.length) {
        selectAll.checked = true;
        selectAll.indeterminate = false;
        return;
      }
      const checkedCount = boxes.filter((b) => b.checked).length;
      selectAll.checked = checkedCount === boxes.length;
      selectAll.indeterminate = checkedCount > 0 && checkedCount < boxes.length;
    }

    function updateFilterTriggerLabel() {
      let label;
      if (!allBoardNames.length) label = "—";
      else if (selectedBoardNames.size === allBoardNames.length) label = "All";
      else if (selectedBoardNames.size === 0) label = "None";
      else label = `${selectedBoardNames.size}/${allBoardNames.length}`;
      setDropdownTriggerText("filter-trigger", "Filter", label);
    }

    function resolutionForZoom(zoom) {
      if (zoom <= 7) return 6;
      if (zoom <= 10) return 7;
      return 8;
    }

    function currentResolution() {
      if (resolutionMode === "auto") return resolutionForZoom(map.getZoom());
      return manualResolution;
    }

    function colorForCount(count, breaks, palette) {
      for (let i = breaks.length - 1; i >= 0; i--) {
        if (count >= breaks[i]) return palette[Math.min(i + 1, palette.length - 1)];
      }
      return palette[0];
    }

    function computeBreaks(features, paletteLength = 5) {
      if (!features.length) return [0];
      const counts = features.map((f) => f.properties.station_count);
      const max = Math.max(...counts, 1);
      const step = Math.max(1, Math.ceil(max / (paletteLength - 1)));
      return Array.from({ length: 4 }, (_, i) => i * step).filter(
        (v, i, arr) => i === 0 || v !== arr[i - 1]
      );
    }

    function ensureProgramStyle(programId, label) {
      if (PROGRAM_STYLES[programId]) {
        if (label) PROGRAM_STYLES[programId].label = label;
        return PROGRAM_STYLES[programId];
      }

      let hash = 0;
      for (let i = 0; i < programId.length; i++) {
        hash = (hash * 31 + programId.charCodeAt(i)) >>> 0;
      }
      const fallback = FALLBACK_PALETTES[hash % FALLBACK_PALETTES.length];
      PROGRAM_STYLES[programId] = {
        label: label || programId.replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase()),
        palettes: fallback.palettes,
        stroke: fallback.stroke,
      };
      return PROGRAM_STYLES[programId];
    }

    function programHasStations(programId) {
      const meta = manifest?.programs?.[programId];
      if (!meta) return false;
      if (meta.coverage_type === "area") {
        return Number.isFinite(meta.polygon_count) && meta.polygon_count > 0;
      }
      return Number.isFinite(meta.station_count) && meta.station_count > 0;
    }

    function programCountLabel(meta) {
      if (meta.coverage_type === "area" && Number.isFinite(meta.polygon_count)) {
        return ` (${meta.polygon_count.toLocaleString()} wetlands)`;
      }
      if (Number.isFinite(meta.station_count)) {
        return ` (${meta.station_count})`;
      }
      return "";
    }

    function setDropdownTriggerText(triggerId, prefix, value) {
      const trigger = document.getElementById(triggerId);
      if (!trigger) return;
      trigger.innerHTML = `${prefix} · ${escapeHtml(String(value))} <span class="ribbon-dropdown-chevron"></span>`;
    }

    function updateProgramsTriggerLabel() {
      const trigger = document.getElementById("programs-trigger");
      if (!trigger) return;
      trigger.innerHTML = `Programs <span class="ribbon-dropdown-chevron"></span>`;
    }

    function updateHexTriggerLabel() {
      const label = resolutionMode === "auto"
        ? "Auto"
        : RES_LABELS[manualResolution];
      setDropdownTriggerText("hex-trigger", "Hex", label);
    }

    function updateBasemapTriggerLabel() {
      setDropdownTriggerText("basemap-trigger", "Map", BASEMAPS[activeBasemap].label);
    }

    function updateOverlaysTriggerLabel() {
      let count = 0;
      if (document.getElementById("county-overlay").checked) count += 1;
      if (document.getElementById("regional-board-overlay").checked) count += 1;
      const label = count === 0 ? "Off" : String(count);
      setDropdownTriggerText("overlays-trigger", "Overlays", label);
    }

    function closeAllDropdowns() {
      document.querySelectorAll(".ribbon-dropdown.open").forEach((dropdown) => {
        dropdown.classList.remove("open");
        const trigger = dropdown.querySelector(".ribbon-dropdown-trigger");
        if (trigger) trigger.setAttribute("aria-expanded", "false");
      });
    }

    function setupDropdowns() {
      document.querySelectorAll(".ribbon-dropdown-trigger").forEach((trigger) => {
        trigger.addEventListener("click", (e) => {
          e.stopPropagation();
          const dropdown = trigger.closest(".ribbon-dropdown");
          const wasOpen = dropdown.classList.contains("open");
          closeAllDropdowns();
          if (!wasOpen) {
            dropdown.classList.add("open");
            trigger.setAttribute("aria-expanded", "true");
          }
        });
      });

      document.querySelectorAll(".ribbon-dropdown-panel").forEach((panel) => {
        panel.addEventListener("click", (e) => e.stopPropagation());
      });

      document.addEventListener("click", closeAllDropdowns);
    }

    function applyProgramControlStyle(labelEl, programId) {
      const style = ensureProgramStyle(programId, manifest.programs[programId].label);
      labelEl.style.color = style.stroke;
      const input = labelEl.querySelector("input");
      if (input) input.style.accentColor = style.stroke;
    }

    function buildProgramControls() {
      const list = document.getElementById("program-list");
      list.innerHTML = "";

      const programIds = Object.keys(manifest.programs).sort((a, b) => {
        const labelA = manifest.programs[a].label || a;
        const labelB = manifest.programs[b].label || b;
        return labelA.localeCompare(labelB);
      });

      programIds.forEach((programId) => {
        const meta = manifest.programs[programId];
        const hasStations = programHasStations(programId);
        const countLabel = programCountLabel(meta);

        const label = document.createElement("label");
        label.className = "program-check" + (hasStations ? "" : " disabled");
        label.title = hasStations
          ? meta.coverage_type === "area"
            ? `${meta.polygon_count?.toLocaleString()} wetland polygons`
            : `${meta.station_count} stations in cleaned data`
          : "No features passed build filtering — check PROGRAM_METADATA bounds in build_h3_geojson.py";
        label.innerHTML = `
          <span class="program-check-main">
            <input type="checkbox" name="program" value="${programId}" ${hasStations && DEFAULT_PROGRAMS.includes(programId) ? "checked" : hasStations ? "" : "disabled"} />
            <span class="program-check-label">${escapeHtml(meta.label)}${countLabel}</span>
          </span>
          <button type="button" class="info-btn" data-program="${programId}" title="View summary" aria-label="View summary for ${escapeHtml(meta.label)}">ⓘ</button>
        `;
        applyProgramControlStyle(label, programId);
        label.querySelector('input[name="program"]').addEventListener("change", () => {
          syncSelectAll();
          updateProgramsTriggerLabel();
          shouldFitBounds = true;
          renderMap();
        });
        label.querySelector(".info-btn").addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          closeAllDropdowns();
          openSummaryDrawer(programId);
        });
        list.appendChild(label);
      });
      syncSelectAll();
      updateProgramsTriggerLabel();
    }

    function selectedPrograms() {
      return [...document.querySelectorAll('input[name="program"]:checked:not(:disabled)')]
        .map((el) => el.value)
        .filter((programId) => programHasStations(programId));
    }

    async function loadManifest() {
      const url = new URL("manifest.json", DATA_BASE).href;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`Failed to load manifest (${response.status})`);
      manifest = await response.json();
      if (!manifest?.programs || typeof manifest.programs !== "object") {
        throw new Error("manifest.json is missing a valid programs section");
      }
    }

    async function loadProfiles() {
      try {
        const response = await fetch(PROFILES_URL);
        if (!response.ok) throw new Error(`Failed to load program profiles (${response.status})`);
        profiles = await response.json();
      } catch (err) {
        console.error(err);
        profiles = null;
      }
    }

    async function loadGeoJSON(programId, resolution) {
      const key = `${programId}_r${resolution}`;
      if (geoCache.has(key)) return geoCache.get(key);

      const programMeta = manifest.programs[programId];
      if (!programMeta) throw new Error(`Program not in manifest: ${programId}`);
      const filename = programMeta.resolutions[String(resolution)];
      if (!filename) throw new Error(`No r${resolution} layer for ${programId}`);
      const url = new URL(filename, DATA_BASE).href;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`Failed to load ${url} (${response.status})`);
      const geojson = await response.json();
      if (geojson.type !== "FeatureCollection" || !Array.isArray(geojson.features)) {
        throw new Error(`${filename} is not a valid FeatureCollection`);
      }
      geoCache.set(key, geojson);
      return geojson;
    }

    function openDetailPanel(feature) {
      closeSummaryDrawer();
      const props = feature.properties;
      const resLabel = RES_LABELS[props.resolution] || `r${props.resolution}`;
      const stations = props.stations || [];

      if (props.overlap) {
        document.getElementById("detail-title").textContent =
          `Overlap — ${props.station_count} feature(s)`;
        document.getElementById("detail-meta").textContent =
          `${props.program_labels} · ${resLabel} hex · H3 ${props.h3_index}`;

        const areaSummaries = props.area_summaries || [];
        if (!stations.length && areaSummaries.length) {
          let html = `<table class="station-table"><thead><tr>
            <th>Program</th><th>Wetland polygons</th><th>Types</th>
          </tr></thead><tbody>`;
          areaSummaries.forEach((a) => {
            html += `<tr>
              <td>${escapeHtml(a.program)}</td>
              <td>${a.polygon_count}</td>
              <td>${escapeHtml(a.wetland_summary || a.level1_summary || "—")}</td>
            </tr>`;
          });
          html += "</tbody></table>";
          if (stations.length) {
            html += "<hr style='margin:12px 0;border:none;border-top:1px solid var(--border)' />";
          } else {
            document.getElementById("detail-body").innerHTML = html;
            document.getElementById("detail-panel").classList.add("open");
            document.getElementById("detail-panel").setAttribute("aria-hidden", "false");
            return;
          }
        }
      } else if (props.coverage_type === "area") {
        const style = ensureProgramStyle(props.program_id, props.program);
        document.getElementById("detail-title").textContent =
          `${style.label} — wetland area`;
        document.getElementById("detail-meta").textContent =
          `${props.polygon_count} wetland polygon(s) in this hex · ${resLabel} · H3 ${props.h3_index}`;
      } else {
        const style = ensureProgramStyle(props.program_id, props.program);
        document.getElementById("detail-title").textContent =
          `${style.label} — ${props.station_count} station(s)`;
        document.getElementById("detail-meta").textContent =
          `${resLabel} hex · H3 ${props.h3_index}`;
      }

      if (props.coverage_type === "area" && !props.overlap) {
        let html = `<table class="station-table"><tbody>
          <tr><th>Wetland polygons in hex</th><td>${props.polygon_count}</td></tr>`;
        if (props.level1_summary) {
          html += `<tr><th>Level 1 types</th><td>${escapeHtml(props.level1_summary)}</td></tr>`;
        }
        if (props.wetland_summary) {
          html += `<tr><th>Wetland types</th><td>${escapeHtml(props.wetland_summary)}</td></tr>`;
        }
        const wetlandNote =
          (profiles?.programs?.[props.program_id]?.wetland_meaning || "").trim() ||
          "Each hex counts RRARI wetland inventory polygons that intersect that cell. Those are delineated habitat features from the source GIS, not monitored water-quality stations.";
        html += `</tbody></table>
          <p style="margin-top:10px;font-size:0.85rem;color:var(--text-soft);line-height:1.5;">
            ${escapeHtml(wetlandNote)}
          </p>`;
        document.getElementById("detail-body").innerHTML = html;
        document.getElementById("detail-panel").classList.add("open");
        document.getElementById("detail-panel").setAttribute("aria-hidden", "false");
        return;
      }

      const metaKeys = new Set();
      const showProgram = props.overlap || stations.some((s) => s.program || s.program_id);
      if (showProgram) metaKeys.add("program");

      stations.forEach((s) => {
        Object.keys(s).forEach((k) => {
          if (!["station_id", "station_name", "lat", "lon", "program", "program_id"].includes(k)) {
            metaKeys.add(k);
          }
        });
      });
      const extraCols = [...metaKeys];

      let html = `<table class="station-table"><thead><tr>
        <th>Name</th><th>ID</th><th>Lat</th><th>Lon</th>
        ${extraCols.map((c) => `<th>${c.replace(/_/g, " ")}</th>`).join("")}
      </tr></thead><tbody>`;

      stations.forEach((s) => {
        const programLabel = s.program || ensureProgramStyle(s.program_id, "").label || "—";
        html += `<tr>
          <td>${escapeHtml(s.station_name || "—")}</td>
          <td>${escapeHtml(s.station_id)}</td>
          <td>${s.lat}</td>
          <td>${s.lon}</td>
          ${extraCols.map((c) => {
            if (c === "program") return `<td>${escapeHtml(programLabel)}</td>`;
            return `<td>${escapeHtml(s[c] || "—")}</td>`;
          }).join("")}
        </tr>`;
      });

      html += "</tbody></table>";
      document.getElementById("detail-body").innerHTML = html;

      const panel = document.getElementById("detail-panel");
      panel.classList.add("open");
      panel.setAttribute("aria-hidden", "false");
    }

    function closeDetailPanel() {
      const panel = document.getElementById("detail-panel");
      panel.classList.remove("open");
      panel.setAttribute("aria-hidden", "true");
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function overlapPatternId(programIds) {
      return `overlap-${programIds.join("-")}`.replace(/[^a-zA-Z0-9_-]/g, "");
    }

    function clearOverlapPatterns(svg) {
      if (!svg) return;
      svg.querySelector('defs[data-hex-patterns="true"]')?.remove();
    }

    function ensureStripePattern(svg, patternId, colors) {
      if (!svg || !colors.length) return;

      let defs = svg.querySelector('defs[data-hex-patterns="true"]');
      if (!defs) {
        defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
        defs.setAttribute("data-hex-patterns", "true");
        svg.insertBefore(defs, svg.firstChild);
      }

      defs.querySelector(`#${CSS.escape(patternId)}`)?.remove();

      const stripeWidth = 6;
      const size = stripeWidth * colors.length;
      const pattern = document.createElementNS("http://www.w3.org/2000/svg", "pattern");
      pattern.setAttribute("id", patternId);
      pattern.setAttribute("patternUnits", "userSpaceOnUse");
      pattern.setAttribute("width", String(size));
      pattern.setAttribute("height", String(size));
      pattern.setAttribute("patternTransform", "rotate(45)");

      colors.forEach((color, i) => {
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", String(i * stripeWidth));
        rect.setAttribute("y", "0");
        rect.setAttribute("width", String(stripeWidth));
        rect.setAttribute("height", String(size));
        rect.setAttribute("fill", color);
        pattern.appendChild(rect);
      });

      defs.appendChild(pattern);
    }

    function indexFeaturesByH3(programLayers) {
      const byH3 = new Map();
      programLayers.forEach(({ programId, features, styleConfig, breaks }) => {
        features.forEach((feature) => {
          const h3 = feature.properties.h3_index;
          if (!byH3.has(h3)) byH3.set(h3, []);
          byH3.get(h3).push({
            programId,
            feature,
            styleConfig,
            fillColor: colorForCount(
              feature.properties.station_count,
              breaks,
              styleConfig.palettes
            ),
          });
        });
      });
      return byH3;
    }

    function buildOverlapFeatures(byH3, resolution) {
      const overlapFeatures = [];
      byH3.forEach((entries, h3Index) => {
        if (entries.length < 2) return;

        const programIds = entries.map((e) => e.programId).sort();
        const patternId = overlapPatternId(programIds);
        const colors = entries.map((e) => e.styleConfig.stroke);
        const labels = entries.map((e) => e.styleConfig.label);
        const stations = entries.flatMap((e) =>
          (e.feature.properties.stations || []).map((s) => ({
            ...s,
            program_id: e.programId,
            program: e.styleConfig.label,
          }))
        );
        const areaSummaries = entries
          .filter((e) => e.feature.properties.coverage_type === "area")
          .map((e) => ({
            program: e.styleConfig.label,
            polygon_count: e.feature.properties.polygon_count,
            wetland_summary: e.feature.properties.wetland_summary,
            level1_summary: e.feature.properties.level1_summary,
          }));
        const featureCount =
          stations.length +
          areaSummaries.reduce((sum, a) => sum + (a.polygon_count || 0), 0);

        overlapFeatures.push({
          type: "Feature",
          geometry: entries[0].feature.geometry,
          properties: {
            overlap: true,
            h3_index: h3Index,
            pattern_id: patternId,
            overlap_colors: colors,
            overlap_programs: programIds,
            program_labels: labels.join(" + "),
            station_count: featureCount,
            area_summaries: areaSummaries,
            resolution,
            stations,
          },
        });
      });
      return overlapFeatures;
    }

    function applyOverlapPatterns(overlapLayer, overlapFeatures) {
      const pane = map.getPane("overlapHexPane");
      const svg = pane?.querySelector("svg");
      if (!svg) return;

      clearOverlapPatterns(svg);
      overlapFeatures.forEach((feature) => {
        ensureStripePattern(
          svg,
          feature.properties.pattern_id,
          feature.properties.overlap_colors
        );
      });

      overlapLayer.eachLayer((layer) => {
        const patternId = layer.feature?.properties?.pattern_id;
        if (patternId && featureMatchesBoardFilter(layer.feature)) {
          layer.setStyle({
            fillColor: `url(#${patternId})`,
            fillOpacity: 1,
            weight: 2,
            color: "#1e293b",
            opacity: 0.95,
          });
        }
      });
    }

    function buildLayer(programId, geojson, breaks, styleConfig, overlappingH3) {
      const features = overlappingH3.size
        ? geojson.features.filter((f) => !overlappingH3.has(f.properties.h3_index))
        : geojson.features;

      if (!features.length) return null;

      const multiProgram = selectedPrograms().length > 1;
      const fillOpacity = multiProgram ? 0.55 : 0.65;

      return L.geoJSON(
        { type: "FeatureCollection", features },
        {
          pane: "hexPane",
          renderer: hexCanvasRenderer,
          style: (feature) => {
            if (!featureMatchesBoardFilter(feature)) {
              return {
                fillColor: "#cbd5e1",
                weight: 0.5,
                opacity: 0.35,
                color: "#94a3b8",
                fillOpacity: 0.16,
              };
            }
            return {
              fillColor: colorForCount(
                feature.properties.station_count,
                breaks,
                styleConfig.palettes
              ),
              weight: 0.75,
              opacity: 0.8,
              color: styleConfig.stroke,
              fillOpacity,
            };
          },
          onEachFeature: (feature, layer) => {
            layer.on("click", (e) => {
              L.DomEvent.stopPropagation(e);
              openDetailPanel(feature);
            });
            const { station_count, program, coverage_type, polygon_count } = feature.properties;
            const tooltipCount = coverage_type === "area"
              ? `${polygon_count ?? station_count} wetland polygon(s)`
              : `${station_count} station(s)`;
            const matchNote = featureMatchesBoardFilter(feature) ? "" : " (outside board filter)";
            layer.bindTooltip(`${program}: ${tooltipCount}${matchNote}`, {
              sticky: false,
              direction: "top",
              opacity: 0.92,
            });
          },
        }
      );
    }

    function buildOverlapLayer(overlapFeatures) {
      if (!overlapFeatures.length) return null;

      const layer = L.geoJSON(
        { type: "FeatureCollection", features: overlapFeatures },
        {
          pane: "overlapHexPane",
          style: (feature) => {
            if (!featureMatchesBoardFilter(feature)) {
              return {
                fillColor: "#cbd5e1",
                fillOpacity: 0.18,
                weight: 1,
                color: "#94a3b8",
                opacity: 0.4,
              };
            }
            return {
              fillColor: `url(#${feature.properties.pattern_id})`,
              fillOpacity: 1,
              weight: 2,
              color: "#1e293b",
              opacity: 0.95,
            };
          },
          onEachFeature: (feature, layer) => {
            layer.on("click", (e) => {
              L.DomEvent.stopPropagation(e);
              openDetailPanel(feature);
            });
            const { station_count, program_labels } = feature.properties;
            layer.bindTooltip(`${program_labels}: ${station_count}`, {
              sticky: false,
              direction: "top",
              opacity: 0.92,
            });
          },
        }
      );

      layer.on("add", () => {
        syncOverlapPatternsWhenReady(layer, overlapFeatures);
      });

      return layer;
    }

    function syncOverlapPatternsWhenReady(overlapLayer, overlapFeatures, attempt = 0) {
      const svg = map.getPane("overlapHexPane")?.querySelector("svg");
      if (!svg) {
        if (attempt < 12) {
          requestAnimationFrame(() =>
            syncOverlapPatternsWhenReady(overlapLayer, overlapFeatures, attempt + 1)
          );
        }
        return;
      }
      applyOverlapPatterns(overlapLayer, overlapFeatures);
    }

    function updateLegend(layerStats, overlapCount = 0) {
      if (legendControl) map.removeControl(legendControl);

      legendControl = L.control({ position: "bottomleft" });
      legendControl.onAdd = function () {
        const panel = L.DomUtil.create("div", "legend-panel");
        const title = L.DomUtil.create("div", "legend-panel-title", panel);
        title.textContent = "Legend";

        layerStats.forEach(({ programId, breaks }) => {
          const style = PROGRAM_STYLES[programId];
          const block = L.DomUtil.create("div", "legend-block", panel);

          const toggle = L.DomUtil.create("button", "legend-toggle", block);
          toggle.type = "button";
          toggle.style.color = style.stroke;
          toggle.innerHTML = `<span class="legend-chevron">&#9654;</span>${style.label}`;
          toggle.setAttribute("aria-expanded", "false");

          const body = L.DomUtil.create("div", "legend-body", block);

          if (legendExpanded.has(programId)) {
            toggle.classList.add("expanded");
            body.classList.add("open");
            toggle.setAttribute("aria-expanded", "true");
          }

          for (let i = 0; i < breaks.length; i++) {
            const lo = breaks[i];
            const hi = breaks[i + 1] != null ? breaks[i + 1] - 1 : "+";
            const color = style.palettes[Math.min(i + 1, style.palettes.length - 1)];
            const label = hi === "+" ? `${lo}+` : `${lo}${lo === hi ? "" : `–${hi}`}`;
            const row = L.DomUtil.create("div", "legend-row", body);
            row.innerHTML = `<span class="legend-swatch" style="background:${color}"></span>${label}`;
          }

          L.DomEvent.disableClickPropagation(toggle);
          toggle.addEventListener("click", () => {
            const isOpen = body.classList.toggle("open");
            toggle.classList.toggle("expanded", isOpen);
            toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
            if (isOpen) legendExpanded.add(programId);
            else legendExpanded.delete(programId);
          });
        });

        L.DomEvent.disableClickPropagation(panel);
        L.DomEvent.disableScrollPropagation(panel);
        return panel;
      };
      legendControl.addTo(map);
    }

    function unionBounds(programIds) {
      if (!manifest || !programIds.length) return null;
      let south = Infinity, west = Infinity, north = -Infinity, east = -Infinity;
      programIds.forEach((id) => {
        const bounds = manifest.programs[id]?.bounds;
        if (!bounds) return;
        const [[s, w], [n, e]] = bounds;
        if (![s, w, n, e].every(Number.isFinite)) return;
        south = Math.min(south, s);
        west = Math.min(west, w);
        north = Math.max(north, n);
        east = Math.max(east, e);
      });
      if (!Number.isFinite(south)) return null;
      return L.latLngBounds([south, west], [north, east]);
    }

    async function renderMap() {
      const token = ++renderToken;
      const programs = selectedPrograms();
      const resolution = currentResolution();
      const statusEl = document.getElementById("status");

      if (!programs.length) {
        activeLayers.forEach((layer) => map.removeLayer(layer));
        activeLayers.clear();
        statusEl.textContent = "Select at least one program.";
        closeDetailPanel();
        renderStatsSection();
        return;
      }

      statusEl.textContent = `Loading ${RES_LABELS[resolution]} hexes…`;

      activeLayers.forEach((layer) => map.removeLayer(layer));
      activeLayers.clear();
      closeDetailPanel();

      const layerStats = [];
      let totalHexes = 0;
      let totalStations = 0;
      let overlapCount = 0;

      try {
        const programLayers = [];
        for (const programId of programs) {
          const geojson = await loadGeoJSON(programId, resolution);
          if (token !== renderToken) return;

          const styleConfig = ensureProgramStyle(
            programId,
            manifest.programs[programId].label
          );
          const breaks = computeBreaks(geojson.features, styleConfig.palettes.length);
          programLayers.push({ programId, features: geojson.features, styleConfig, breaks, geojson });
        }

        const overlappingH3 = new Set();
        let overlapFeatures = [];

        if (programs.length > 1) {
          const byH3 = indexFeaturesByH3(programLayers);
          byH3.forEach((entries, h3) => {
            if (entries.length >= 2) overlappingH3.add(h3);
          });
          overlapFeatures = buildOverlapFeatures(byH3, resolution);
          overlapCount = overlapFeatures.length;
        }

        for (const { programId, geojson, styleConfig, breaks } of programLayers) {
          const layer = buildLayer(programId, geojson, breaks, styleConfig, overlappingH3);
          if (layer) {
            layer.addTo(map);
            activeLayers.set(programId, layer);
          }
          layerStats.push({ programId, breaks });

          totalHexes += overlappingH3.size
            ? geojson.features.filter((f) => !overlappingH3.has(f.properties.h3_index)).length
            : geojson.features.length;
          totalStations += geojson.features.reduce(
            (s, f) => s + f.properties.station_count,
            0
          );
        }

        if (overlapFeatures.length) {
          const overlapLayer = buildOverlapLayer(overlapFeatures);
          if (overlapLayer) {
            overlapLayer.addTo(map);
            activeLayers.set("__overlap__", overlapLayer);
            totalHexes += overlapFeatures.length;
          }
        }

        updateLegend(layerStats, overlapCount);

        const modeLabel = resolutionMode === "auto"
          ? `Auto → ${RES_LABELS[resolution]}`
          : RES_LABELS[resolution];

        const overlapNote = overlapCount ? ` · ${overlapCount} overlap hexes` : "";
        const filterNote = isBoardFilterActive()
          ? ` · Filter: ${selectedBoardNames.size}/${allBoardNames.length} boards`
          : "";
        statusEl.textContent =
          `${programs.length} program(s) · ${modeLabel} · ${totalStations} stations in ${totalHexes} hexes${overlapNote}${filterNote}`;

        lastRenderedResolution = resolution;
        updateHexTriggerLabel();

        if (shouldFitBounds) {
          const bounds = unionBounds(programs);
          if (bounds && bounds.isValid()) {
            map.fitBounds(bounds, { padding: [32, 32], maxZoom: 10 });
          }
          shouldFitBounds = false;
        }

        renderStatsSection();
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
        console.error(err);
      }
    }

    function syncSelectAll() {
      const boxes = [...document.querySelectorAll('input[name="program"]:not(:disabled)')];
      const selectAll = document.getElementById("select-all");
      if (!boxes.length) {
        selectAll.checked = false;
        selectAll.indeterminate = false;
        updateProgramsTriggerLabel();
        return;
      }
      const checked = boxes.filter((b) => b.checked).length;
      selectAll.checked = checked === boxes.length;
      selectAll.indeterminate = checked > 0 && checked < boxes.length;
      updateProgramsTriggerLabel();
    }

    document.getElementById("select-all").addEventListener("change", (e) => {
      const checked = e.target.checked;
      document.querySelectorAll('input[name="program"]:not(:disabled)').forEach((box) => {
        box.checked = checked;
      });
      updateProgramsTriggerLabel();
      shouldFitBounds = true;
      renderMap();

        btn.classList.add("active");

    document.getElementById("county-overlay").addEventListener("change", async (e) => {

        e.target.checked = false;

      }

    document.getElementById("regional-board-overlay").addEventListener("change", async (e) => {
      try {

      } catch (err) {

        updateOverlaysTriggerLabel();
        console.error(err);

    document.getElementById("filter-select-all").addEventListener("change", (e) => {
      const checked = e.target.checked;
      document.querySelectorAll('input[name="board"]').forEach((box) => {
        box.checked = checked;
      });
      syncBoardSelectAll();
      updateFilterTriggerLabel();
      renderMap();
    });

    map.on("zoomend", () => {
      updateOverlayLabelVisibility();
      if (resolutionMode !== "auto") return;
      const res = currentResolution();
      if (res !== lastRenderedResolution) renderMap();
    });

    map.on("click", closeDetailPanel);
    document.getElementById("detail-close").addEventListener("click", closeDetailPanel);

    // ---- Summary browser drawer ----

    function summaryProgramOrder() {
      if (!profiles?.programs) return [];
      return Object.keys(profiles.programs);
    }

    function renderStatsSection() {
      const container = document.getElementById("stats-section");
      if (!container) return;
      const programs = selectedPrograms();

      if (!manifest) {
        container.innerHTML = '<p style="color:var(--text-soft);font-size:.78rem;margin-bottom:12px;">Waiting for map data…</p>';
        return;
      }
      if (!programs.length) {
        container.innerHTML = '<p style="color:var(--text-soft);font-size:.78rem;margin-bottom:12px;">Select at least one program to see stats.</p>';
        return;
      }

      const filterActive = isBoardFilterActive();
      const filterLabel = filterActive ? ` · filtered by ${selectedBoardNames.size}/${allBoardNames.length} boards` : "";

      const line = programs.map((id) => {
        const meta = manifest.programs[id];
        return meta.coverage_type === "area"
          ? `${Number(meta.polygon_count).toLocaleString()} wetlands`
          : `${Number(meta.station_count).toLocaleString()} stations`;
      }).join(" + ");

      container.innerHTML = `
        <p style="font-size:0.75rem;color:var(--text-soft);margin-bottom:12px;">
          On the map now: ${escapeHtml(line)} from manifest${escapeHtml(filterLabel)}
        </p>
      `;
    }

    function renderWelcomeOverview() {
      const intro = profiles?.map_intro;
      if (!intro) {
        return "<p>Program profile data is unavailable right now, but the map below still works. Pick programs from the Programs menu to explore station footprints.</p>";
      }
      const p1 = `${intro.summary} ${intro.comparable_why}`.replace(/\s+/g, " ").trim();
      const p2 = (intro.honesty_note || "").replace(/\s+/g, " ").trim();
      return `
        <p>${escapeHtml(p1)}</p>
        <p>${escapeHtml(p2)}</p>
        <p style="margin-top:12px;">Source code: <a href="${GITHUB_REPO_URL}" target="_blank" rel="noopener">${escapeHtml(GITHUB_REPO_URL)}</a></p>
      `;
    }

    function renderWelcomePrograms() {
      if (!profiles?.programs) return "<p>Program profile data is unavailable right now.</p>";
      const ids = summaryProgramOrder();
      if (!ids.length) return "<p>Program profile data is unavailable right now.</p>";
      const id = ids[Math.min(summaryIndex, ids.length - 1)];
      const p = profiles.programs[id];
      const websiteUrl = p.website || (p.data_links || []).find((l) => l.url)?.url || "";
      return `
        <div class="welcome-program-nav summary-nav" style="margin-bottom:10px;">
          <button type="button" class="ribbon-btn" id="welcome-prev">‹ Prev</button>
          <button type="button" class="ribbon-btn" id="welcome-next">Next ›</button>
        </div>
        <h3 style="font-size:1rem;margin-bottom:6px;">${escapeHtml(p.short_label || p.label)}</h3>
        ${websiteUrl ? `<p style="margin-bottom:10px;"><a class="summary-url" style="margin-bottom:0;" href="${websiteUrl}" target="_blank" rel="noopener">${escapeHtml(websiteUrl)}</a></p>` : ""}
        <p>${escapeHtml(p.summary)}</p>
      `;
    }

    function setWelcomeTab(tab) {
      if (tab === "find-data") tab = "overview";
      document.querySelectorAll(".modal-tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === tab));
      const body = document.getElementById("welcome-body");
      if (tab === "programs") {
        summaryProgramIds = summaryProgramOrder();
        if (summaryIndex >= summaryProgramIds.length) summaryIndex = 0;
        body.innerHTML = renderWelcomePrograms();
        document.getElementById("welcome-prev")?.addEventListener("click", () => {
          if (!summaryProgramIds.length) return;
          summaryIndex = (summaryIndex - 1 + summaryProgramIds.length) % summaryProgramIds.length;
          setWelcomeTab("programs");
        });
        document.getElementById("welcome-next")?.addEventListener("click", () => {
          if (!summaryProgramIds.length) return;
          summaryIndex = (summaryIndex + 1) % summaryProgramIds.length;
          setWelcomeTab("programs");
        });
      } else {
        body.innerHTML = renderWelcomeOverview();
      }
    }

    function openWelcomeModal() {
      const modal = document.getElementById("welcome-modal");
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      setWelcomeTab("overview");
    }

    function closeWelcomeModal() {
      const modal = document.getElementById("welcome-modal");
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
    }

    function setSoloProgram(programId) {
      document.querySelectorAll('input[name="program"]').forEach((box) => {
        if (box.disabled) return;
        box.checked = box.value === programId;
      });
      syncSelectAll();
      updateProgramsTriggerLabel();
    }

    function focusSummaryProgram(programId) {
      if (!programId) return;
      summaryFocusMode = true;
      setSoloProgram(programId);
      shouldFitBounds = false;
      renderMap();

      const bounds = unionBounds([programId]);
      if (bounds && bounds.isValid()) {
        if (typeof map.flyToBounds === "function") {
          map.flyToBounds(bounds, { padding: [40, 40], maxZoom: 10 });
        } else {
          map.fitBounds(bounds, { padding: [40, 40], maxZoom: 10 });
        }
      }

      renderSummaryProgram();
    }

    function renderDataAccessBlock(p) {
      const access = p.data_access;
      if (!access || !Array.isArray(access.steps) || !access.steps.length) return "";
      const steps = access.steps.map((step) => {
        // Auto-link bare URLs in step text
        const linked = escapeHtml(step).replace(
          /(https?:\/\/[^\s<]+)/g,
          '<a href="$1" target="_blank" rel="noopener">$1</a>'
        );
        return `<li style="margin-bottom:6px;">${linked}</li>`;
      }).join("");
      const note = access.note
        ? `<p style="margin-top:10px;font-size:0.88rem;color:var(--text-soft);">${escapeHtml(access.note)}</p>`
        : "";
      return `
        <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border);">
          <h3 style="font-size:0.95rem;font-weight:650;margin-bottom:8px;">How to get the data</h3>
          <ol style="margin:0 0 0 1.2rem;padding:0;font-size:0.9rem;line-height:1.55;">${steps}</ol>
          ${note}
        </div>
      `;
    }

    function renderSummaryProgram() {
      const body = document.getElementById("summary-program-detail");

      if (!summaryProgramIds.length) {
        body.innerHTML = "<p style='color:var(--text-soft);'>Program profile data is unavailable right now.</p>";
        document.getElementById("summary-title").textContent = "Program summary";
        document.getElementById("summary-meta").textContent = "";
        return;
      }

      const id = summaryProgramIds[summaryIndex];
      const p = profiles.programs[id];
      document.getElementById("summary-title").textContent = p.short_label || p.label;
      document.getElementById("summary-meta").textContent = "";

      const websiteUrl = p.website || (p.data_links || []).find((l) => l.url)?.url || "";
      const narrative = p.narrative || p.summary || "";
      const wetlandExtra = (p.wetland_meaning || "").trim();
      const paragraph = `${narrative}${wetlandExtra ? ` ${wetlandExtra}` : ""}`.replace(/\s+/g, " ").trim();

      body.innerHTML = `
        ${websiteUrl ? `<a class="summary-url" href="${websiteUrl}" target="_blank" rel="noopener">${escapeHtml(websiteUrl)}</a>` : ""}
        <p>${escapeHtml(paragraph)}</p>
        ${renderDataAccessBlock(p)}
      `;
    }

    function openSummaryDrawer(programId) {
      closeDetailPanel();
      summaryProgramIds = summaryProgramOrder();
      if (programId && summaryProgramIds.includes(programId)) {
        summaryIndex = summaryProgramIds.indexOf(programId);
      } else if (summaryIndex >= summaryProgramIds.length) {
        summaryIndex = 0;
      }

      const drawer = document.getElementById("summary-drawer");
      const alreadyOpen = drawer.classList.contains("open");
      if (!alreadyOpen) {
        summaryRestorePrograms = selectedPrograms();
      }

      document.body.classList.add("summary-open");
      drawer.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");

      const currentId = summaryProgramIds[summaryIndex];
      if (currentId) focusSummaryProgram(currentId);
      else renderSummaryProgram();

      setTimeout(() => map.invalidateSize(), 220);
    }

    function closeSummaryDrawer() {
      const drawer = document.getElementById("summary-drawer");
      const wasOpen = drawer.classList.contains("open");
      drawer.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
      document.body.classList.remove("summary-open");

      if (wasOpen && summaryFocusMode) {
        summaryFocusMode = false;
        if (summaryRestorePrograms) {
          const restoreSet = new Set(summaryRestorePrograms);
          document.querySelectorAll('input[name="program"]').forEach((box) => {
            if (box.disabled) return;
            box.checked = restoreSet.has(box.value);
          });
          syncSelectAll();
          updateProgramsTriggerLabel();
        }
        summaryRestorePrograms = null;
        shouldFitBounds = true;
        renderMap();
      }

      setTimeout(() => map.invalidateSize(), 220);
    }

    document.getElementById("summary-prev").addEventListener("click", () => {
      if (!summaryProgramIds.length) return;
      summaryIndex = (summaryIndex - 1 + summaryProgramIds.length) % summaryProgramIds.length;
      focusSummaryProgram(summaryProgramIds[summaryIndex]);
    });
    document.getElementById("summary-next").addEventListener("click", () => {
      if (!summaryProgramIds.length) return;
      summaryIndex = (summaryIndex + 1) % summaryProgramIds.length;
      focusSummaryProgram(summaryProgramIds[summaryIndex]);
    });
    document.getElementById("summary-close").addEventListener("click", closeSummaryDrawer);
    document.getElementById("summary-btn").addEventListener("click", () => openSummaryDrawer());

    document.getElementById("about-btn").addEventListener("click", openWelcomeModal);
    document.getElementById("welcome-close-x").addEventListener("click", closeWelcomeModal);
    document.getElementById("welcome-got-it").addEventListener("click", closeWelcomeModal);
    document.getElementById("welcome-modal").addEventListener("click", (e) => {
      if (e.target.id === "welcome-modal") closeWelcomeModal();
    });
    document.querySelectorAll(".modal-tab").forEach((t) => {
      t.addEventListener("click", () => setWelcomeTab(t.dataset.tab));
    });

    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      const welcome = document.getElementById("welcome-modal");
      if (welcome.classList.contains("open")) {
        closeWelcomeModal();
        return;
      }
      const summary = document.getElementById("summary-drawer");
      if (summary.classList.contains("open")) {
        closeSummaryDrawer();
        return;
      }
      closeDetailPanel();
    });

    (async function init() {
      setupDropdowns();
      updateHexTriggerLabel();
      updateBasemapTriggerLabel();
      updateOverlaysTriggerLabel();
      updateFilterTriggerLabel();

      const profilesPromise = loadProfiles();

      try {
        await loadManifest();
        buildProgramControls();
        await renderMap();
      } catch (err) {
        document.getElementById("status").textContent = `Error: ${err.message}`;
        console.error(err);
      }

      try {
        const boardsGeo = await ensureRegionalBoardsLoaded();
        indexBoardGeometries(boardsGeo);
        buildBoardFilterControls();
      } catch (err) {
        console.error("Regional boards failed to load for filter:", err);
      }

      await profilesPromise;
      renderStatsSection();
      openWelcomeModal();
    })();
  </script>
</body>
</html>
